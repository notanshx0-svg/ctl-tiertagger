name: Build EternalTags Folia Fix

on:
  push:
    branches:
      - temp-eternaltags-folia-build

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout EternalTags 1.3.5
        uses: actions/checkout@v4
        with:
          repository: Oribuin/EternalTags
          ref: 1.3.5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply Folia entity scheduler fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/main/java/xyz/oribuin/eternaltags/gui/PluginMenu.java")
          s = p.read_text()
          old = "EternalTags.getInstance().getScheduler().runTask(player::closeInventory);"
          new = "EternalTags.getInstance().getScheduler().runTaskAtEntity(player, player::closeInventory);"
          if old not in s:
              raise SystemExit("target line not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar --no-daemon

      - name: Upload patched jar
        uses: actions/upload-artifact@v4
        with:
          name: EternalTags-1.3.5-FoliaFix
          path: build/libs/EternalTags-1.3.5.jar
          if-no-files-found: error
